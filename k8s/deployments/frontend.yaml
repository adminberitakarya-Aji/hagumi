apiVersion: apps/v1
kind: Deployment
metadata:
  name: hagumi-frontend
  labels:
    app: hagumi-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hagumi-frontend
  template:
    metadata:
      labels:
        app: hagumi-frontend
    spec:
      containers:
      - name: hagumi-frontend
        image: your-docker-registry/hagumi-frontend:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: hagumi-frontend-svc
spec:
  selector:
    app: hagumi-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
