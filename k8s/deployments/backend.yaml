apiVersion: apps/v1
kind: Deployment
metadata:
  name: hagumi-backend
  labels:
    app: hagumi-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hagumi-backend
  template:
    metadata:
      labels:
        app: hagumi-backend
    spec:
      containers:
      - name: hagumi-backend
        image: your-docker-registry/hagumi-backend:latest
        ports:
        - containerPort: 8080
        envFrom:
        - secretRef:
            name: hagumi-secrets
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
